name: Publish package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag
        required: true
        default: next
        type: choice
        options: [next, latest]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Publish with trusted publishing
        run: npx --yes npm@11.19.0 publish --provenance --access public --tag "${{ inputs.tag }}"
