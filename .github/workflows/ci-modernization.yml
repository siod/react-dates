name: Modernization CI

on:
  push:
    branches: [modernisation/react-18-implementation]
  pull_request:
  workflow_dispatch:

concurrency:
  group: modernization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  unit:
    name: Unit · Node ${{ matrix.node }} · React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24.x']
        react: ['18.3.1', '19.2.8']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run lint
      - run: npm test -- --reporter=dot
      - run: npm run check:deps

  coverage:
    name: Coverage ratchet · Node 22 · React 19
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -- --reporter=dot

  build:
    name: Build · Node ${{ matrix.node }} · React ${{ matrix.react }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24.x']
        react: ['18.3.1', '19.2.8']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run build

  storybook:
    name: Storybook · Node ${{ matrix.node }} · React ${{ matrix.react }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24.x']
        react: ['18.3.1', '19.2.8']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run build:storybook

  package:
    name: Packed consumers · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and test isolated consumers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/react-dates-package"
          npm pack --pack-destination "$RUNNER_TEMP/react-dates-package"
          TARBALL="$(find "$RUNNER_TEMP/react-dates-package" -name '*.tgz' -print -quit)"
          cp -R fixtures/cjs "$RUNNER_TEMP/react-dates-cjs-consumer"
          cp -R fixtures/esm "$RUNNER_TEMP/react-dates-esm-consumer"
          REACT_DATES_TARBALL="$TARBALL" npm --prefix "$RUNNER_TEMP/react-dates-cjs-consumer" run test:packed
          REACT_DATES_TARBALL="$TARBALL" npm --prefix "$RUNNER_TEMP/react-dates-esm-consumer" run test:packed

  browser:
    name: Browser · Node ${{ matrix.node }} · React ${{ matrix.react }}
    runs-on: ubuntu-latest
    needs: [unit, build]
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24.x']
        react: ['18.3.1', '19.2.8']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
